<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan PO Kaos - Teroptimasi</title>
<style>
    /* Styling tetap mempertahankan desain Anda namun lebih ringan */
    *{box-sizing:border-box; font-family:'Segoe UI', sans-serif; margin:0; padding:0;}
    body{padding:10px; background:#f0f4f8; font-size:14px;}
    .card{background:white; padding:15px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:15px;}
    .wadah-tabel{overflow-x:auto; margin-top:10px; border:1px solid #ddd; border-radius:8px;}
    table{width: 2500px; border-collapse:collapse;}
    th{background:#1e40af; color:white; padding:10px; text-align:center;}
    td{border:1px solid #e2e8f0; padding:5px; text-align:center;}
    input,select{width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px;}
    .tombol{padding:10px 15px; border:none; border-radius:6px; cursor:pointer; font-weight:600; margin:3px; color:white;}
    .ringkas{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:10px;}
    .p7{background:#1e40af; color:white; padding:10px; border-radius:8px; grid-column:1 / -1; text-align:center;}
    #fileInput{display:none;}
</style>
</head>
<body>

<div class="card">
  <h1>📦 CATATAN PO KAOS</h1>
  <input type="text" id="inputCari" oninput="debouncePencarian()" placeholder="🔍 Cari nama, reseller, atau status..." style="padding:12px; margin-top:10px; border:2px solid #3b82f6;">
  
  <div class="wadah-tabel">
    <table id="tabelData">
      <thead>
        <tr>
          <th>Pilih</th><th>No</th><th>Nama Pembeli</th><th>Reseller</th><th>Status</th><th>Ukuran</th>
          <th>Model</th><th>Warna</th><th>Jumlah</th><th>Total Jual</th><th>Uang Masuk</th>
          <th>Sisa</th><th>Status Bayar</th><th>Tanggal</th><th>Keterangan</th><th>Kirim</th><th>Modal</th><th>Bagi Reseller</th><th>Untung</th><th>Hapus</th>
        </tr>
      </thead>
      <tbody id="isiTabel"></tbody>
    </table>
  </div>
  <div style="margin-top:10px;">
    <button class="tombol" onclick="tambahBaris()" style="background:#16a34a;">+ Tambah</button>
    <button class="tombol" onclick="simpanCadangan()" style="background:#9333ea;">💾 Simpan</button>
    <button class="tombol" onclick="document.getElementById('fileInput').click()" style="background:#0d9488;">📂 Buka</button>
    <button class="tombol" onclick="unduhExcel()" style="background:#d97706;">📄 Excel</button>
  </div>
  <input type="file" id="fileInput" accept=".json" onchange="bukaCadangan(event)">
</div>

<div class="card">
    <h3>📊 RANGKUMAN</h3>
    <div class="ringkas" id="ringkasan"></div>
    <div class="p7" style="margin-top:10px;">💸 KEUNTUNGAN BERSIH: Rp <span id="totUntung">0</span></div>
</div>

<div class="card">
    <h3>📢 PREVIEW PESAN</h3>
    <textarea id="teksBroadcast" style="width:100%; height:100px; margin-top:10px;">Assalamu'alaikum. Berikut rincian pesanan Anda: {{DAFTAR_PESANAN}} | Total: {{TOTAL_BAYAR}} | Status: {{STATUS_BAYAR}} | Sisa: {{SISA_TAGIHAN}}. Pelunasan maks: Jumat, 14 Agustus 2026.</textarea>
    <button class="tombol" onclick="buatPreviewPesan()" style="background:#7c3aed; width:100%; margin-top:10px;">👁️ Buat Preview</button>
    <div id="hasilPreview" style="margin-top:10px; white-space:pre-wrap; background:#f8fafc; padding:10px; display:none;"></div>
</div>

<script>
const KUNCI_SIMPAN = "Catatan_PO_Kaos_2026";
let data = JSON.parse(localStorage.getItem(KUNCI_SIMPAN)) || [];
let daftarIndexTerpilih = [];
let timer;

const BAGI_HASIL = 10000;
const DAFTAR_HARGA = {pendek: {biasa:115000, xxl:120000}, panjang: {biasa:125000, xxl:130000}};
const DAFTAR_MODAL = {pendek: {biasa:70000, xxl:75000}, panjang: {biasa:75000, xxl:80000}};

function tampilkanTabel(filter = "") {
    const isi = document.getElementById("isiTabel");
    const keyword = filter.toLowerCase();
    isi.innerHTML = "";
    
    data.forEach((b, i) => {
        if (keyword && !b.namaPembeli.toLowerCase().includes(keyword) && !b.namaReseller.toLowerCase().includes(keyword)) return;

        const jenis = b.ukuran === "XXL" ? "xxl" : "biasa";
        const harga = DAFTAR_HARGA[(b.model||"Pendek").toLowerCase()][jenis];
        const modal = DAFTAR_MODAL[(b.model||"Pendek").toLowerCase()][jenis];
        const total = harga * (b.jumlah||1);
        const untung = total - (modal * (b.jumlah||1)) - (BAGI_HASIL * (b.jumlah||1));
        
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td><input type="checkbox" onchange="ubahStatusPilihan(${i}, this.checked)"></td>
            <td>${i+1}</td>
            <td><input type="text" value="${b.namaPembeli||''}" onchange="updateData(${i}, 'namaPembeli', this.value)"></td>
            <td><input type="text" value="${b.namaReseller||''}" onchange="updateData(${i}, 'namaReseller', this.value)"></td>
            <td><select onchange="updateData(${i}, 'status', this.value)"><option ${b.status=='Aktif'?'selected':''}>Aktif</option><option ${b.status=='Batal'?'selected':''}>Batal</option></select></td>
            <td><select onchange="updateData(${i}, 'ukuran', this.value)"><option>S</option><option>M</option><option>L</option><option>XL</option><option>XXL</option></select></td>
            <td><select onchange="updateData(${i}, 'model', this.value)"><option>Pendek</option><option>Panjang</option></select></td>
            <td><input type="text" value="${b.warna||'Putih'}" onchange="updateData(${i}, 'warna', this.value)"></td>
            <td><input type="number" value="${b.jumlah||1}" onchange="updateData(${i}, 'jumlah', this.value)"></td>
            <td>${total.toLocaleString()}</td>
            <td><input type="number" value="${b.bayar||0}" onchange="updateData(${i}, 'bayar', this.value)"></td>
            <td>${(total - (b.bayar||0)).toLocaleString()}</td>
            <td>${(b.bayar||0) >= total ? "Lunas" : "Menyicil"}</td>
            <td><input type="date" value="${b.tanggal||''}" onchange="updateData(${i}, 'tanggal', this.value)"></td>
            <td><input type="text" value="${b.keterangan||''}" onchange="updateData(${i}, 'keterangan', this.value)"></td>
            <td><select onchange="updateData(${i}, 'kirim', this.value)"><option ${b.kirim=='Belum'?'selected':''}>Belum</option><option ${b.kirim=='Sudah'?'selected':''}>Sudah</option></select></td>
            <td>${(modal*(b.jumlah||1)).toLocaleString()}</td>
            <td>${(BAGI_HASIL*(b.jumlah||1)).toLocaleString()}</td>
            <td>${untung.toLocaleString()}</td>
            <td><button onclick="hapusBaris(${i})">×</button></td>
        `;
        isi.appendChild(tr);
    });
    hitungRingkasan();
}

function debouncePencarian() {
    clearTimeout(timer);
    timer = setTimeout(() => { tampilkanTabel(document.getElementById("inputCari").value); }, 300);
}

function updateData(i, k, v) { data[i][k] = v; localStorage.setItem(KUNCI_SIMPAN, JSON.stringify(data)); tampilkanTabel(); }
function tambahBaris() { data.push({namaPembeli:"", namaReseller:"", status:"Aktif", ukuran:"S", model:"Pendek", warna:"Putih", jumlah:1, bayar:0, kirim:"Belum"}); tampilkanTabel(); }
function hapusBaris(i) { if(confirm("Hapus?")) { data.splice(i,1); localStorage.setItem(KUNCI_SIMPAN, JSON.stringify(data)); tampilkanTabel(); } }
function ubahStatusPilihan(i, checked) { if(checked) daftarIndexTerpilih.push(i); else daftarIndexTerpilih = daftarIndexTerpilih.filter(idx => idx != i); }

function hitungRingkasan() {
    let tP=0, tM=0, tUntung=0;
    data.forEach(b => {
        const j = b.ukuran=="XXL"?"xxl":"biasa";
        const h = DAFTAR_HARGA[(b.model||"Pendek").toLowerCase()][j];
        tP += Number(b.jumlah||1);
        tM += Number(b.bayar||0);
        tUntung += (h - DAFTAR_MODAL[(b.model||"Pendek").toLowerCase()][j] - BAGI_HASIL) * (b.jumlah||1);
    });
    document.getElementById("totUntung").textContent = tUntung.toLocaleString();
}

function buatPreviewPesan() {
    if(daftarIndexTerpilih.length == 0) return alert("Centang pesanan dulu!");
    let dP="", tB=0, sB=0;
    daftarIndexTerpilih.forEach(i => {
        const b = data[i];
        const j = b.ukuran=="XXL"?"xxl":"biasa";
        const h = DAFTAR_HARGA[(b.model||"Pendek").toLowerCase()][j];
        tB += h*(b.jumlah||1); sB += Number(b.bayar||0);
        dP += `${b.namaPembeli} (${b.model} ${b.ukuran}), `;
    });
    let p = document.getElementById("teksBroadcast").value
        .replace("{{DAFTAR_PESANAN}}", dP)
        .replace("{{TOTAL_BAYAR}}", tB.toLocaleString())
        .replace("{{STATUS_BAYAR}}", (tB-sB <= 0 ? "Lunas" : "Menyicil"))
        .replace("{{SISA_TAGIHAN}}", (tB-sB).toLocaleString());
    const hP = document.getElementById("hasilPreview");
    hP.textContent = p; hP.style.display = "block";
}

function simpanCadangan(){ const b = new Blob([JSON.stringify(data)],{type:'application/json'}); const a = document.createElement("a"); a.href=URL.createObjectURL(b); a.download="Backup_PO.json"; a.click(); }
function bukaCadangan(e){ const r = new FileReader(); r.onload = (ev) => { data = JSON.parse(ev.target.result); localStorage.setItem(KUNCI_SIMPAN, JSON.stringify(data)); tampilkanTabel(); }; r.readAsText(e.target.files[0]); }
function unduhExcel(){ let csv = "Nama;Jumlah;Total\n" + data.map(b=>`${b.namaPembeli};${b.jumlah};${b.jumlah*115000}`).join("\n"); const b = new Blob([csv],{type:'text/csv'}); const a = document.createElement("a"); a.href=URL.createObjectURL(b); a.download="Data.csv"; a.click(); }

tampilkanTabel();
</script>
</body>
</html>
